name: N1 validation (isolated branch)

on:
  push:
    branches:
      - fix/n1-transfer-integrity-tests
  pull_request:
    branches:
      - main
      - feature/owner-launch-integration-e
      - security/owner-db-login-limiter
      - feature/owner-encrypted-backup-gate
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'server/**'
      - 'database/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'index.html'
      - 'metadata.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/n1-validation.yml'
  workflow_dispatch:

concurrency:
  group: n1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm lockfile is tracked (bun.lock is the package-manager lock).
      # setup-node's npm cache requires a package-lock.json or npm-shrinkwrap.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Execute isolated financial tests
        run: npm test
      - name: Owner authentication security tests
        run: npm run test:server
      - name: Verify owner server-only storage and conflict guards
        run: npm run test:owner-adapter
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify public release contains no demo records or preview UI
        run: node scripts/check-production-no-demo.mjs
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser UI regression tests
        run: npm run test:e2e
