name: N2 dues and settlements validation

on:
  push:
    branches:
      - feature/n2-dues-partial-payments-reminders
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: n2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Financial regression tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests (N1 and N2)
        run: npm run test:e2e
