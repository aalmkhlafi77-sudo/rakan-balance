name: N3 Flutter mobile verification

on:
  push:
    branches:
      - fix/n3-mobile-build-and-functional-completion
  pull_request:
    paths:
      - 'rakan_balance_mobile/**'
      - '.github/workflows/n3-flutter-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rakan_balance_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check toolchain
        run: flutter --version
      - name: Generate missing standard Android and iOS Flutter host scaffolds
        run: |
          flutter create --no-pub --platforms=android,ios --project-name=rakan_balance_mobile --org=com.rakanbalance .
          rm -f test/widget_test.dart
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run Dart tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug
      - name: Verify Android APK exists and record fingerprint
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      # GitHub Actions artifact storage is currently over quota.
      # APK upload is intentionally omitted; enable only when quota is restored.
