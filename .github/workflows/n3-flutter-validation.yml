name: N3 Flutter mobile verification

on:
  push:
    branches:
      - fix/n3-mobile-build-and-functional-completion
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'rakan_balance_mobile/**'
      - '.github/workflows/n3-flutter-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rakan_balance_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check toolchain
        run: flutter --version
      - name: Generate missing standard Android and iOS Flutter host scaffolds
        run: |
          flutter create --no-pub --platforms=android,ios --project-name=rakan_balance_mobile --org=com.rakanbalance .
          rm -f test/widget_test.dart
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run Dart tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug
      - name: Verify Android APK exists and record fingerprint
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      # GitHub Actions artifact storage is currently over quota.
      # APK upload is intentionally omitted; enable only when quota is restored.

  flutter-ios-simulator:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rakan_balance_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Xcode and Flutter
        run: |
          xcodebuild -version
          flutter --version
      - name: Prepare native iOS build files
        run: flutter create --no-pub --platforms=ios --project-name=rakan_balance_mobile --org=com.rakanbalance .
      - name: Resolve iOS dependencies
        run: flutter pub get
      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Confirm simulator Runner app exists
        run: test -d build/ios/iphonesimulator/Runner.app
      - name: Boot an available iPhone simulator and run UI smoke test
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for group in d['devices'].values() for x in group if x.get('isAvailable') and x['name'].startswith('iPhone')))")"
          test -n "$DEVICE_UDID"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$DEVICE_UDID" || true
          python3 - "$DEVICE_UDID" <<'PY'
          import subprocess
          import sys

          udid = sys.argv[1]
          subprocess.run(
              ["xcrun", "simctl", "bootstatus", udid, "-b"],
              check=True,
              timeout=180,
          )
          subprocess.run(
              ["flutter", "test", "integration_test/app_smoke_test.dart", "-d", udid],
              check=True,
              timeout=600,
          )
          PY
